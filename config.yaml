# 船舱泥沙体积测量完整流程配置

output_dir: "E:/work-lidar/base/data/data/922/test5/output"

# 装沙前点云目录。程序会自动读取目录下所有 .pcd 文件，按文件名排序，第一个作为基准。
before_dir: "E:/work-lidar/base/data/data/922/test5/before"

# 装沙后点云目录。程序会自动读取目录下所有 .pcd 文件，按文件名排序，第一个作为基准。
after_dir: "E:/work-lidar/base/data/data/922/test5/after"

# 已单独提取好的纯泥沙表面点云。为空时，默认使用 04_after_crop.pcd 继续处理。
sand_surface_input: ""

# 1. 同一时相多点位增量配准：下采样 -> 曲率 ROI -> FPFH + RANSAC -> ROI ICP
multi_view_registration:
  # 合并后是否再统一下采样；0 表示不下采样。
  merge_voxel_size: 0.0
  # 单个 scan 配准检查失败后的参数重试次数和倍率。
  max_pair_attempts: 4
  retry_voxel_multipliers: [1.0, 0.75, 1.5, 0.5]
  # ICP 阈值 = 本次 voxel_size * icp_distance_ratio * 本次阈值倍率。
  retry_icp_threshold_multipliers: [1.0, 1.5, 2.0, 2.5]

  # 参数迁自 try/registration_compare_config.json；ROI 在 FPFH 前不再下采样。
  # 源点云和当前 Global Cloud 分别提取 ROI；点数不足记失败，不回退全点云。
  curvature_roi:
    voxel_size: 0.1
    normal_radius_ratio: 3.0
    feature_radius_ratio: 5.0
    curvature_radius_ratio: 4.0
    source_curvature_percentile: 70.0
    target_curvature_percentile: 70.0
    min_roi_points: 100

    # DBSCAN 聚类保留最大的若干个簇；false 表示启用聚类筛选。
    disable_cluster_filter: false
    cluster_eps_ratio: 4.0
    min_cluster_points: 8
    max_clusters: 5

    # 可选法向方向与粗配准后法向一致性筛选。
    enable_normal_axis_filter: false
    normal_axis: [0.0, 0.0, 1.0]
    normal_axis_angle: 35.0
    enable_post_normal_filter: false
    post_normal_angle: 35.0

    ransac_distance_ratio: 2.0
    ransac_n: 3
    ransac_max_iteration: 4000000
    edge_length_threshold: 0.9
    ransac_confidence: 0.99

    # point-to-point ICP 使用粗配准后的 ROI；不使用完整原始点云迭代。
    icp_distance_ratio: 2.0
    icp_max_iteration: 500

  # 完整验证云由原始点云固定下采样生成，无需标准变换或预先给定结构。
  validation:
    voxel_size: 0.1
    distance_threshold: 0.2
    # 按同一组 P2 点云上一轮已通过的候选指标调整固定几何验收线。
    min_fitness: 0.45
    max_rmse: 0.10
    review_min_fitness: 0.40
    review_max_rmse: 0.12
    min_correspondences: 100
    max_translation_scene_ratio: 2.0
  # 第二遍只使用第一遍通过的扫描作参考，不让待确认扫描互相作证。
  candidate_review:
    max_candidates: 4
    deduplicate_translation: 0.01
    deduplicate_rotation_deg: 0.1
    max_reference_scans: 2
    max_pair_attempts: 2
    translation_threshold: 0.2
    rotation_threshold_deg: 2.0

  # 最后一个成功合并的扫描到首帧；闭环失败则整组重跑，部分成功可继续。
  loop_closure:
    enabled: false
    max_pipeline_attempts: 3
    translation_threshold: 0.5
    rotation_threshold_deg: 5.0

# 2. 装沙前后整体点云配准：after_full_native -> before_full 坐标系
before_after_registration:
  voxel_size: 0.10
  source_normal_radius_ratio: 3.0
  target_normal_radius_ratio: 3.0
  feature_radius_ratio: 5.0
  curvature_radius_ratio: 3.0
  source_curvature_percentile: 80.0
  target_curvature_percentile: 80.0
  min_feature_points: 300

  source_height_min: null
  source_height_max: null
  target_height_min: null
  target_height_max: null
  height_axis: z

  # normal_axis 为空表示不启用法向方向约束；示例：[0, 0, 1]
  normal_axis: null
  normal_axis_angle: 35.0

  # ROI 格式：[xmin, xmax, ymin, ymax, zmin, zmax]；为空表示不启用固定 ROI。
  source_roi: null
  target_roi: null

  cluster_eps_ratio: 3.0
  source_min_cluster_points: 15
  target_min_cluster_points: 15
  max_clusters: 10

  ransac_distance_ratio: 3.0
  ransac_n: 4
  ransac_max_iteration: 4000000
  ransac_confidence: 0.999

  post_normal_angle: 50.0
  disable_post_normal_filter: false
  icp_distance_ratio: 2.0
  icp_max_iteration: 500

# 3. 自动裁剪：从装沙前点云提取舱壁平面和裁剪范围
auto_cut:
  voxel_size: 0.04
  distance_threshold: 0.08
  ransac_n: 3
  num_iterations: 10000
  max_planes: 16
  min_plane_points: 500
  vertical_normal_z_threshold: 0.2
  parallel_angle_threshold: 12.0
  min_group_angle: 45.0
  min_plane_separation: 0.3
  line_search_radius: 0.1
  line_search_expand: 4
  crop_margin_x: -0.2
  crop_margin_y: -0.15
  z_min: null
  z_max: null
  z_margin: 0.2

# 4. 船舱底部平面拟合
bottom_plane:
  ransac_dist: 0.02
  grid_res: 0.02
  bottom_ratio: 0.08

# 5. 纯泥沙点云处理
sand_processing:
  denoise:
    enabled: true
    nb_neighbors: 60
    std_ratio: 3.5

  voxel:
    enabled: true
    voxel_size: 0.02

  fill_holes:
    enabled: true
    grid_size: 0.1
    n_min: 1
    small_hole_max_cells: 20
    medium_hole_max_cells: 50
    idw_power_small: 2.5
    idw_radius_small: 3
    idw_power_medium: 2.0
    idw_radius_medium: 5
    idw_power_large: 1.5
    idw_radius_large: 9
    min_component_cells: 1
    max_component_cells: 300
    min_boundary_support_ratio: 0.2
    min_boundary_support_cells: 5
    reject_touching_grid_edge: false

# 6. TIN 体积计算
volume:
  max_edge: 0.1

# 每完成一步是否显示该步生成的点云结果。
visualization:
  enabled: False
  show_multiview_pair: true
  show_multiview_final: true
  width: 960
  height: 720
  left: 100
  top: 100
  clear_colors: false
  show_normals: false
  print_info: true

# simple：步骤概要、曲率 ROI 点数/保留比例、配准与重试结果；隐藏阶段耗时和内存。
# detailed：在上述信息外显示 ROI 关键参数、粗细配准阶段、评估指标及耗时/内存。
# 但写入 txt 的日志始终是完整信息。
logging:
  console_level: detailed
  file_name: v_measure_full.txt
